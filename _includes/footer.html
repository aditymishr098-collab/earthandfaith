<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,hi,hy,es,fr,de,ar,ru,zh-CN,bn,ur,ta,te,mr,gu,pa',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
    autoDisplay: false
  }, 'ef-lang');
}
(function () {
  if (!document.getElementById('ef-lang')) { return; }
  var s = document.createElement('script');
  s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit&hl=en';
  s.async = true;
  document.body.appendChild(s);
})();
</script>
