---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }} <span class="ef-read">{{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</span></p>
    {% if page.tags.size > 0 %}<p class="ef-tags">{% for t in page.tags %}<a class="ef-tag" href="{{ '/topics/' | relative_url }}#{{ t | slugify }}">{{ t }}</a>{% endfor %}</p>{% endif %}
  </header>
  <div class="post-content">{{ content }}</div>
  <p class="ef-back"><a href="{{ '/topics/' | relative_url }}">Browse all topics</a></p>
</article>
